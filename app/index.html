<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Open Author Clock</title>
  <meta name="description" content="A literary clock that tells the time through quotes from literature, one for every minute of the day.">
  <meta name="author" content="Amber Caravalho">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Open Author Clock">
  <meta property="og:description" content="A literary clock that tells the time through quotes from literature, one for every minute of the day.">
  <meta property="og:url" content="https://clock.ambercaravalho.com">
  <meta property="og:image" content="https://clock.ambercaravalho.com/icons/icon-512.png">
  <meta name="twitter:card" content="summary">

  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="preload" href="fonts/tinos-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/tinos-700-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="modulepreload" href="scripts/config.js">
  <link rel="modulepreload" href="scripts/quotes.js">
  <link rel="modulepreload" href="scripts/fit-text.js">

  <link rel="stylesheet" href="styles/styles.css">
  <script type="module" src="scripts/main.js"></script>
</head>
<body>
  <main id="quoteContainer" aria-live="polite" aria-atomic="true">
    <blockquote id="quote"><span id="quoteText">Loading quote&hellip;</span></blockquote>
    <cite id="author"></cite>
  </main>

  <a
    href="https://github.com/ambercaravalho/open-author-clock"
    class="github-link"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="View source code on GitHub"
  >
    <svg width="24" height="24" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
      <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
    </svg>
  </a>

  <noscript>
    <div class="error">
      <p>This clock needs JavaScript to pick a quote for the current minute.</p>
    </div>
  </noscript>
</body>
</html>
